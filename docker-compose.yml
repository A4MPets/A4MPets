services:
  graphhopper:
    image: israelhikingmap/graphhopper:latest
    container_name: a4mpets-graphhopper
    restart: unless-stopped
    ports:
      - "8989:8989"
      - "8990:8990"
    volumes:
      - ./backend/graphhopper/data:/data
      - ./backend/graphhopper/config.yml:/config/config.yml:ro
    entrypoint: ["./graphhopper.sh"]
    command:
      - --config
      - /config/config.yml
      - --input
      - /data/map.osm.pbf
      - --graph-cache
      - /data/graph-cache

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: a4mpets-backend
    restart: unless-stopped
    depends_on:
      - graphhopper
    working_dir: /var/www/html
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      GRAPHHOPPER_BASE_URL: http://graphhopper:8989
      GRAPHHOPPER_API_KEY: ""
    command: >
      sh -c "
      if [ ! -f .env ]; then cp .env.template .env; fi;
      composer install --no-interaction --prefer-dist;
      touch database/database.sqlite;
      if grep -q 'APP_KEY=base64:generate_your_key_with_php_artisan_key_generate' .env; then php artisan key:generate --force; fi;
      php artisan migrate --force;
      php artisan serve --host=0.0.0.0 --port=8000
      "

  frontend:
    image: ghcr.io/cirruslabs/flutter:stable
    container_name: a4mpets-frontend
    restart: unless-stopped
    depends_on:
      - backend
    working_dir: /app
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
    command: >
      sh -c "
      flutter config --enable-web;
      flutter pub get;
      flutter run -d web-server --web-hostname=0.0.0.0 --web-port=8080 --dart-define=A4M_API_BASE_URL=http://backend:8000/api
      "
