$kind: http-request
name: 'F7-016 GET /api/routes'
order: 4000
method: GET
url: '{{base_url}}/api/routes?per_page=20'
headers:
  - key: Accept
    value: application/json
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('F7-016: HTTP 200', function () { pm.expect(pm.response.code).to.eql(200); });
      const json = pm.response.json();
      pm.test('F7-016: data array', function () { pm.expect(json.data).to.be.an('array'); });
