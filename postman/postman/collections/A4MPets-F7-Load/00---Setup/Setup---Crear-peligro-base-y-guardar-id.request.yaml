$kind: http-request
name: 'Setup - Crear peligro base y guardar id'
order: 2000
method: POST
url: '{{base_url}}/api/hazards'
headers:
  - key: Accept
    value: application/json
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{access_token}}'
body:
  type: json
  content: |-
    {
      "incident_latitude": {{lat_iter}},
      "incident_longitude": {{lng_iter}},
      "impact_radius_meters": 50,
      "risk_level_code": "low",
      "category_code": "traffic",
      "estimated_duration_code": "temporary",
      "description": "Peligro base F7 {{unique_suffix}}",
      "narrative_description": "Peligro base creado para comentarios F7"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Setup hazard: creado', function () { pm.expect(pm.response.code).to.eql(201); });
      const json = pm.response.json();
      const id = json.data && json.data.id;
      if (id) {
        pm.environment.set('created_hazard_id', id);
        pm.environment.set('hazard_id', id);
      }
      pm.test('Setup hazard: contiene id', function () { pm.expect(pm.environment.get('hazard_id')).to.not.be.empty; });
