services:
  graphhopper:
    image: israelhikingmap/graphhopper:${GRAPHHOPPER_IMAGE_TAG:-11.0}
    container_name: a4mpets-graphhopper
    restart: unless-stopped
    environment:
      JAVA_OPTS: ${GRAPHHOPPER_JAVA_OPTS:--Xms512m -Xmx1536m}
    volumes:
      - ./backend/graphhopper/data/map.osm.pbf:/data/map.osm.pbf:ro
      - graphhopper_cache:/data/graph-cache
      - ./backend/graphhopper/config.yml:/config/config.yml:ro
    ports:
      - "${GRAPHHOPPER_PORT:-8989}:8989"
      - "${GRAPHHOPPER_ADMIN_PORT:-8990}:8990"
    entrypoint: ["./graphhopper.sh"]
    command:
      - --config
      - /config/config.yml
      - --input
      - /data/map.osm.pbf
      - --graph-cache
      - /data/graph-cache

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: a4mpets-backend
    volumes:
      # SQLite persiste en volumen named
      - backend_sqlite_data:/data
    environment:
      - APP_NAME=A4MPets
      - APP_ENV=production
      - APP_KEY=${APP_KEY:-base64:wQoPdz7KfnHMZbLyL+2sb0l0mE6EdxpmXiYSK6bhL2Q=}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${BACKEND_PUBLIC_URL:-http://localhost:8000}
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/data/database.sqlite
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - GRAPHHOPPER_BASE_URL=http://graphhopper:8989
      - GRAPHHOPPER_API_KEY=
      - LOG_CHANNEL=stack
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      graphhopper:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_BASE_URL=${FRONTEND_API_BASE_URL:-/api}
    container_name: a4mpets-frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      - NGINX_PORT=80
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend_sqlite_data:
    driver: local
  graphhopper_cache:
    driver: local
