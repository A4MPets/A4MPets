version: '3.8'

services:
  graphhopper:
    image: israelhikingmap/graphhopper:latest
    container_name: a4mpets-graphhopper
    volumes:
      - /home/nestor/A4MPets/backend/graphhopper/data:/data
      - /home/nestor/A4MPets/backend/graphhopper/config.yml:/config/config.yml:ro
    ports:
      - "8989:8989"
      - "8990:8990"
    environment:
      - JAVA_OPTS=-Xmx2g -Xms2g
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: a4mpets-backend
    volumes:
      # SQLite persiste en volumen named
      - backend_sqlite_data:/data
    environment:
      - APP_NAME=A4MPets
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/data/database.sqlite
      - GRAPHHOPPER_BASE_URL=http://graphhopper:8989
      - LOG_CHANNEL=stack
    ports:
      - "8000:8000"
    depends_on:
      graphhopper:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_BASE_URL=http://localhost:8000/api
    container_name: a4mpets-frontend
    ports:
      - "8080:80"
    environment:
      - NGINX_PORT=80
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  backend_sqlite_data:
    driver: local
